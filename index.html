<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatoire des Compétences & Risque IA</title>
  
  <!-- Chargement de la bibliothèque Tableau Embedding API v3 -->
  <script type="module" src="https://embedding.tableau.com/api/tableau.embedding.3.latest.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    header {
      width: 100%;
      max-width: 1400px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      color: #0f172a;
    }
    p {
      color: #64748b;
      font-size: 0.9rem;
    }
    .viz-container {
      width: 100%;
      max-width: 1400px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      overflow: hidden;
    }
    tableau-viz {
      width: 100%;
      height: 850px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Cockpit RH — Requalification Métiers face à l'IA</h1>
    <p>Visualisation interactive intégrée via Tableau Embedding API v3</p>
  </header>

  <div class="viz-container">
    <!-- Remplace 'src' par l'URL de ta vue Tableau Cloud -->
    <tableau-viz 
      id="tableauDashboard"
      src="https://10ax.online.tableau.com/t/joseph_tableau/views/Transition_upskilling_jobtitle/Tableaudebord1"
      toolbar="bottom"
      hide-tabs>
    </tableau-viz>
  </div>

</body>
</html>
